# .github/dependabot.yml (build-deployment step 5)
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Analyzers compile against the Roslyn of the oldest supported SDK (roslyn-analyzers ANA-009);
      # a newer version would stop the analyzers from loading in older compilers.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
